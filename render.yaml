# ---------------------------------------------------------------------------
# Holy Sai Smart School 360 — Render Blueprint
#
# One web service builds the Dockerfile and serves both the REST API and the
# built SPA on a single origin, so the refresh-token cookie stays SameSite=Strict
# and no CORS configuration is needed.
#
# The database is Supabase Postgres, reached through the Supavisor *connection
# pooler* — Render has no IPv6 outbound and Supabase's direct host
# (db.<ref>.supabase.co) is IPv6-only. Uploaded documents go to a private
# Supabase Storage bucket, because Render's filesystem is wiped on every deploy.
#
# Values marked `sync: false` are entered in the Render dashboard, never here.
# See docs/DEPLOYMENT.md for the full walkthrough.
# ---------------------------------------------------------------------------
services:
  - type: web
    name: holy-sai
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Singapore is the closest Render region to India.
    region: singapore
    # Free instance: 512 MB / 0.1 CPU, sleeps after 15 minutes idle and takes
    # ~30-60s to wake. Fine for testing and demos. Move to `starter` before
    # anyone depends on it — see "Free tier" in docs/DEPLOYMENT.md.
    plan: free
    healthCheckPath: /api/health
    # No dockerCommand on purpose. The image's CMD already runs migrations and
    # then the server (backend/dist/scripts/start.js). Passing a `sh -c "a && b"`
    # string here fails: Render does not hand the && chain to the shell intact,
    # and the whole string comes back as `sh: ...: not found` (exit 127).
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000

      # --- Database (Supabase) ------------------------------------------------
      # Use the Session pooler URI from Supabase → Project Settings → Database:
      #   postgresql://postgres.<ref>:<password>@aws-0-<region>.pooler.supabase.com:5432/postgres
      - key: DATABASE_URL
        sync: false
      # Supabase terminates TLS with its own CA. 'no-verify' encrypts without
      # chain verification; to verify properly, set this to 'true' and paste
      # Supabase's CA bundle into DATABASE_CA_CERT.
      - key: DATABASE_SSL
        value: no-verify
      # Kept small: one free 512 MB instance, and Supabase's free tier caps
      # pooler client connections. Raise it alongside the instance size.
      - key: DATABASE_POOL_MAX
        value: 5

      # --- Auth ---------------------------------------------------------------
      # Generated once by Render and then held steady. Changing either value
      # signs every user out.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: true

      # The SPA is served from this same origin, so CORS is never consulted for
      # it; this only matters for non-browser or mobile clients. Render assigns
      # https://<service name>.onrender.com, but appends a suffix if the name is
      # already taken — correct this after the first deploy if so.
      - key: CORS_ORIGINS
        value: https://holy-sai.onrender.com

      # --- Document storage (Supabase Storage) --------------------------------
      - key: STORAGE_DRIVER
        value: supabase
      # https://<ref>.supabase.co
      - key: SUPABASE_URL
        sync: false
      # Project Settings → API → service_role. Server-side only.
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: documents
      - key: UPLOAD_MAX_MB
        value: 10

      # --- Limits & logging ---------------------------------------------------
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX
        value: 3000
      - key: AUTH_RATE_LIMIT_MAX
        value: 20
      - key: LOG_LEVEL
        value: info

      # --- Paper Correction (exam-vision/) ------------------------------------
      # The marking service below. Requests are signed with a secret both
      # services share; the service refuses anything unsigned.
      # If Render gave the service a different address, correct it here.
      - key: EXAM_VISION_URL
        value: https://holy-sai-exam.onrender.com
      - key: EXAM_VISION_SECRET
        fromService:
          type: web
          name: holy-sai-exam
          envVarKey: EXAM_GATEWAY_SECRET

  # ---------------------------------------------------------------------------
  # Paper Correction service (exam-vision/): Claude reads and marks answer sheets.
  #
  # FREE PLAN = TESTING ONLY. A free instance has no persistent disk and sleeps
  # after 15 minutes idle; every sleep, restart or deploy wipes its data —
  # examinations, uploaded sheets and marks. Students and staff are re-sent by
  # the main service automatically. Send approved marks to an assessment before
  # leaving it idle. For real use: plan starter + a disk mounted at /data.
  # ---------------------------------------------------------------------------
  - type: web
    name: holy-sai-exam
    runtime: docker
    dockerfilePath: ./exam-vision/Dockerfile
    dockerContext: ./exam-vision
    region: singapore
    plan: free
    healthCheckPath: /api/health
    envVars:
      # Shared with the main service (EXAM_VISION_SECRET). Generated once by Render.
      - key: EXAM_GATEWAY_SECRET
        generateValue: true
      # Survive the wipes: the Claude key and the acknowledgement that student
      # pages are sent to Anthropic come from here (AI configuration overrides
      # them until the next wipe). Enter them in the Render dashboard.
      - key: EXAM_CLAUDE_API_KEY
        sync: false
      # Type 1 once the school's consent covers sending pages to Anthropic.
      - key: EXAM_EXTERNAL_PROCESSING_ACKNOWLEDGED
        sync: false
      # One sheet at a time: the free instance has 512 MB.
      - key: EXAM_WORKERS
        value: "1"
      # SAMPLE demo: two Grade 5 A tests (Science, Maths) already read and marked,
      # rebuilt automatically after every wipe. Set to 0 to switch off.
      - key: EXAM_DEMO
        value: "1"
