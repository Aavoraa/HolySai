# Production-like stack: PostgreSQL + the API/web image.
# Secrets come from the environment or a .env file next to this compose file.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: holysai
      POSTGRES_USER: holysai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U holysai -d holysai"]
      interval: 10s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://holysai:${POSTGRES_PASSWORD}@db:5432/holysai
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://school.example.com}
      COOKIE_SECURE: "true"
      # Paper Correction (exam-vision/): reached only on the compose network
      EXAM_VISION_URL: http://exam:8006
      EXAM_VISION_SECRET: ${EXAM_VISION_SECRET:?set EXAM_VISION_SECRET (32+ characters)}
    volumes:
      - uploads:/data/uploads
    ports:
      - "4000:4000"
    # Migrations + server, via the image's default entrypoint.
    command: ["node", "backend/dist/scripts/start.js"]

  # Paper Correction service: Claude reads and marks answer sheets. No published port —
  # only the app reaches it. The Claude key is entered in the web app (AI configuration).
  exam:
    build: ./exam-vision
    restart: unless-stopped
    environment:
      EXAM_GATEWAY_SECRET: ${EXAM_VISION_SECRET:?set EXAM_VISION_SECRET (32+ characters)}
    volumes:
      - examdata:/data

volumes:
  pgdata:
  uploads:
  examdata:
