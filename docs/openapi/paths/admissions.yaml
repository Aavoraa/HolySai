/applications/{id}/status:
  post:
    tags: [Admissions]
    summary: Move an application through the workflow
    description: >
      Submitted → Under Review → Assessment Scheduled → Offer Made → Accepted (→ enrol); Rejected / Withdrawn from open states.
      Offer Made requires every document verified. Rejected/Withdrawn close the lead as Lost. The lead stage follows the application.
    x-permission: admissions.manage
    security: [{ bearerAuth: [] }]
    parameters:
      - $ref: '#/components/parameters/IdPath'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [status, note]
            properties:
              status: { type: string, enum: [Submitted, Under Review, Assessment Scheduled, Offer Made, Accepted, Rejected, Withdrawn] }
              note: { type: string }
              assessmentAt: { type: string, format: date-time, description: Required for Assessment Scheduled }
              assessmentScore: { type: number }
              offerExpiresOn: { type: string, format: date, description: Defaults to 14 days for Offer Made }
    responses:
      '200': { $ref: '#/components/responses/Ok' }
      '400': { $ref: '#/components/responses/BadRequest' }
      '403': { $ref: '#/components/responses/Forbidden' }
      '404': { $ref: '#/components/responses/NotFound' }

/applications/{id}/documents/{docId}:
  patch:
    tags: [Admissions]
    summary: Set an application document's status (Verified records the verifier)
    x-permission: admissions.manage
    security: [{ bearerAuth: [] }]
    parameters:
      - $ref: '#/components/parameters/IdPath'
      - { name: docId, in: path, required: true, schema: { type: string, format: uuid } }
    requestBody:
      required: true
      content:
        application/json:
          schema: { type: object, required: [status], properties: { status: { type: string, enum: [Pending, Submitted, Verified, Rejected] } } }
    responses:
      '200': { $ref: '#/components/responses/Ok' }
      '400': { $ref: '#/components/responses/BadRequest' }
      '403': { $ref: '#/components/responses/Forbidden' }
      '404': { $ref: '#/components/responses/NotFound' }

/applications/{id}/enrol:
  post:
    tags: [Admissions]
    summary: Enrol an accepted applicant — creates the Student Master record
    description: >
      In one transaction: students + enrollments + guardian (existing parent by id or phone, else a new parents row)
      + student_guardians + optional student_transport + student_tracking_profiles (disabled) + timeline event;
      sets admissions.student_id / status Enrolled, moves the lead to Enrolled, updates any referral, notifies principals.
    x-permission: admissions.manage
    security: [{ bearerAuth: [] }]
    parameters:
      - $ref: '#/components/parameters/IdPath'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [sectionId]
            description: Student and guardian fields left out are taken from the admission form; the other parent on the form is linked as a second guardian.
            properties:
              sectionId: { type: string, format: uuid, description: Must be on the application's campus }
              firstName: { type: string }
              lastName: { type: string }
              dateOfBirth: { type: string, format: date }
              gender: { type: string, enum: [M, F, O] }
              admittedOn: { type: string, format: date }
              house: { type: string }
              address: { type: string }
              city: { type: string }
              pincode: { type: string, pattern: '^[0-9]{6}$' }
              guardian:
                type: object
                properties:
                  parentId: { type: string, format: uuid }
                  fullName: { type: string, description: Defaults to the lead's parent }
                  phone: { type: string, description: Defaults to the lead's phone }
                  email: { type: string, format: email }
                  relationship: { type: string, enum: [Father, Mother, Guardian] }
              transport:
                type: object
                properties:
                  routeId: { type: string, format: uuid }
                  stopId: { type: string, format: uuid }
    responses:
      '201': { $ref: '#/components/responses/Created' }
      '400': { $ref: '#/components/responses/BadRequest' }
      '403': { $ref: '#/components/responses/Forbidden' }
      '404': { $ref: '#/components/responses/NotFound' }
      '409': { description: Already enrolled, or the section is full }

